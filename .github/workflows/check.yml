name: HyperTerminal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux fish
      - run: python3 tests/verify.py
      - run: python3 tests/detection.py
