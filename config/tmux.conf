# Shared backend for movable HyperTerminal sessions.
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -g history-limit 200000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g escape-time 10
set -g renumber-windows on
set -g exit-empty off
set -g status-position bottom
set -g status-style "bg=#151711,fg=#c4c9ac"
set -g status-left-length 64
set -g status-left "#[fg=#de9137,bold] HyperTerminal:#S #[default]"
set -g status-right-length 52
set -g status-right "#[fg=#be8839]Ctrl-b o: pop out  Ctrl-b d: detach #[default]"
setw -g window-status-format " #[fg=#858a74]#I:#W "
setw -g window-status-current-format " #[fg=#f1ddb0,bold]#I:#W "
set -g pane-border-style "fg=#292c22"
set -g pane-active-border-style "fg=#de9137"
set -g message-style "bg=#694321,fg=#f1ddb0"

# Move the current managed session into a standalone Konsole window.
bind-key o run-shell -b '@BIN_DIR@/hyperterminal-session popout "#{session_name}"'

# Remove intentionally closed sessions from the reboot-restore registry.
set-hook -g session-closed 'run-shell "@BIN_DIR@/hyperterminal-session forget #{hook_session_name}"'
