name: HyperTerminal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux fish
      - run: cargo test && cargo build --release
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: python3 tests/binary.py
        env:
          HYPERTERMINAL_TEST_BINARY: target/x86_64-unknown-linux-musl/release/hyperterminal
      - run: python3 tests/verify.py
      - run: python3 tests/detection.py
      - uses: actions/upload-artifact@v4
        with:
          name: hyperterminal-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/hyperterminal
